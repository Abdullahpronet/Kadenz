[project]
name = "kadenz"
version = "0.0.1"
description = "Drop in clips + a song, get a beat-synced After Effects project. 100% local AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10",
  "scenedetect>=0.6",
  "opencv-python",
  "soundfile",
  "numpy",
]

[project.optional-dependencies]
ai = ["ollama"]
dev = ["pytest", "ruff"]

[project.scripts]
kadenz = "kadenz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
