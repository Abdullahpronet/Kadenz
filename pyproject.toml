[project]
name = "beatforge"
version = "0.0.1"
description = "Drop in clips + a song, get a beat-synced After Effects project. 100% local AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10",
  "scenedetect[opencv]>=0.6",
  "numpy",
]

[project.optional-dependencies]
ai = ["ollama"]
dev = ["pytest", "ruff"]

[project.scripts]
beatforge = "beatforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
